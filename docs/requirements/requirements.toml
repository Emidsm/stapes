# Software requirements. Each test names the IDs it verifies, and
# tools/traceability.py fails if any requirement here has no passing test.

[[requirement]]
id = "SRS-SIM-001"
statement = "Simulated time shall be derived from an integer tick count, with no accumulated drift over one simulated hour."
code = ["core/base/include/stapes/base/sim_clock.hpp"]

[[requirement]]
id = "SRS-SIM-002"
statement = "The simulation clock shall reject a non-positive time step."
code = ["core/base/src/sim_clock.cpp"]

[[requirement]]
id = "SRS-DET-001"
statement = "The random generators shall reproduce the published algorithms' output exactly, checked against an independent implementation."
code = ["core/base/src/random.cpp", "tools/reference_vectors.py"]

[[requirement]]
id = "SRS-DET-002"
statement = "The same seed shall produce a bit-identical result, and a different seed a different one."
code = ["core/base/src/random.cpp", "tests/support/kinematics_workload.hpp"]

[[requirement]]
id = "SRS-DET-003"
statement = "Random streams shall be independent: drawing from one shall not change another."
code = ["core/base/include/stapes/base/random.hpp"]

[[requirement]]
id = "SRS-DET-004"
statement = "Uniform samples shall stay in their half-open range, and uniform and Gaussian samples shall match their theoretical moments."
code = ["core/base/src/random.cpp"]

[[requirement]]
id = "SRS-DET-005"
statement = "The state hash shall match FNV-1a and detect a one-bit change in any value or a change in order."
code = ["core/base/include/stapes/base/state_hash.hpp"]

[[requirement]]
id = "SRS-KIN-001"
statement = "Forward kinematics shall match hand-calculated tool poses and always produce a rigid transform."
code = ["core/kinematics/src/forward_kinematics.cpp"]

[[requirement]]
id = "SRS-KIN-002"
statement = "The geometric Jacobian shall match central finite differences of forward kinematics."
code = ["core/kinematics/src/forward_kinematics.cpp"]

[[requirement]]
id = "SRS-KIN-003"
statement = "From a seed within 0.2 rad per joint of a solution, or from home to a solution within 0.5 rad per joint, inverse kinematics shall reach the pose within 1 um and 1 urad, as confirmed by forward kinematics."
code = ["core/kinematics/src/inverse_kinematics.cpp"]

[[requirement]]
id = "SRS-KIN-004"
statement = "Inverse kinematics shall never return a configuration outside the joint limits, for any target or seed."
code = ["core/kinematics/src/inverse_kinematics.cpp"]

[[requirement]]
id = "SRS-KIN-005"
statement = "Inverse kinematics shall never report success falsely: unreachable targets, exhausted iterations and non-finite inputs shall each be reported as such, with the true remaining error."
code = ["core/kinematics/src/inverse_kinematics.cpp"]

[[requirement]]
id = "SRS-KIN-006"
statement = "The arm model shall reject invalid geometry, and joint-limit checks shall treat NaN as out of limits."
code = ["core/kinematics/src/arm_model.cpp"]

[[requirement]]
id = "SRS-KIN-007"
statement = "Rotation error shall be correct across the full range of angles, including very small angles and a half turn."
code = ["core/math/src/rotation.cpp"]

[[requirement]]
id = "SRS-KIN-008"
statement = "The manipulability measure shall vanish at the wrist singularity and be positive away from singularities."
code = ["core/kinematics/src/forward_kinematics.cpp"]

[[requirement]]
id = "SRS-KIN-009"
statement = "Starting from home with up to 32 deterministic restarts, inverse kinematics shall reach at least 99 % of random reachable poses, and shall stop at the first solution."
code = ["core/kinematics/src/inverse_kinematics.cpp"]

[[requirement]]
id = "SRS-KIN-010"
statement = "Inverse kinematics shall bound the change to any joint per iteration, and shall stop early when further iterations cannot make meaningful progress."
code = ["core/kinematics/src/inverse_kinematics.cpp"]

[[requirement]]
id = "SRS-RT-001"
statement = "Random draws, forward kinematics, the Jacobian and inverse kinematics shall perform no heap allocation."
code = ["core/kinematics/src/inverse_kinematics.cpp", "core/kinematics/src/forward_kinematics.cpp", "core/base/src/random.cpp"]

[[requirement]]
id = "SRS-DYN-001"
statement = "The dynamic model shall reject masses, centres of mass, inertias and gravity that are non-finite or physically impossible."
code = ["core/dynamics/src/dynamic_model.cpp"]

[[requirement]]
id = "SRS-DYN-002"
statement = "Inverse dynamics shall match hand-calculated gravity and centripetal loads, and an independent virtual-work calculation of gravity torque."
code = ["core/dynamics/src/rigid_body_dynamics.cpp"]

[[requirement]]
id = "SRS-DYN-003"
statement = "The mass matrix shall match a hand-calculated inertia and inverse dynamics column by column, and be symmetric and positive definite."
code = ["core/dynamics/src/rigid_body_dynamics.cpp"]

[[requirement]]
id = "SRS-DYN-004"
statement = "Forward dynamics shall invert inverse dynamics."
code = ["core/dynamics/src/rigid_body_dynamics.cpp"]

[[requirement]]
id = "SRS-DYN-005"
statement = "In unforced motion, energy drift shall vanish at the integrator's order as the step shrinks, and potential energy shall match a hand calculation."
code = ["core/dynamics/src/rigid_body_dynamics.cpp"]

[[requirement]]
id = "SRS-ACT-001"
statement = "Motor friction shall combine Coulomb, Stribeck and viscous terms, always opposing motion."
code = ["core/plant/src/actuator.cpp"]

[[requirement]]
id = "SRS-ACT-002"
statement = "The gearbox shall transmit no torque inside its backlash, push in proportion to penetration beyond it, and never pull."
code = ["core/plant/src/actuator.cpp"]

[[requirement]]
id = "SRS-ACT-003"
statement = "Motor torque shall be clamped to its limit, and a NaN command shall produce no torque."
code = ["core/plant/src/actuator.cpp"]

[[requirement]]
id = "SRS-SEN-001"
statement = "Encoders shall add Gaussian noise and quantise to whole counts, and reject invalid parameters."
code = ["core/plant/src/encoder.cpp"]

[[requirement]]
id = "SRS-SEN-002"
statement = "The force sensor shall apply scale error, noise, and a random-walk bias whose spread grows with the square root of time."
code = ["core/plant/src/force_sensor.cpp"]

[[requirement]]
id = "SRS-ARM-001"
statement = "The simulated arm shall fall under gravity with no command, and stay at rest with neither gravity nor command."
code = ["core/plant/src/simulated_arm.cpp"]

[[requirement]]
id = "SRS-ARM-002"
statement = "The motor shall move through the backlash before the link moves, and encoders shall read the motor, not the link."
code = ["core/plant/src/simulated_arm.cpp"]

[[requirement]]
id = "SRS-ARM-003"
statement = "The simulated arm shall apply each joint's torque limit, and treat a NaN command as no torque on that joint only."
code = ["core/plant/src/simulated_arm.cpp"]

[[requirement]]
id = "SRS-ARM-004"
statement = "An external wrench shall act on the links through the Jacobian transpose and be reported by the force sensor in the tool frame."
code = ["core/plant/src/simulated_arm.cpp"]

[[requirement]]
id = "SRS-ARM-005"
statement = "The physics shall stay finite and bounded under repeated full-torque reversals."
code = ["core/plant/src/simulated_arm.cpp"]

[[requirement]]
id = "SRS-ARM-006"
statement = "The simulated arm shall advance its clock by one control period per tick, and reject an invalid timing or initial configuration."
code = ["core/plant/src/simulated_arm.cpp"]

[[requirement]]
id = "SRS-CTL-001"
statement = "The PID controller shall compute proportional, integral, derivative and feedforward terms correctly."
code = ["core/control/src/pid_controller.cpp"]

[[requirement]]
id = "SRS-CTL-002"
statement = "A setpoint step shall cause no derivative kick, and the derivative shall be low-pass filtered."
code = ["core/control/src/pid_controller.cpp"]

[[requirement]]
id = "SRS-CTL-003"
statement = "Controller output shall stay within each joint's limit, and the integral shall not wind up while saturated, though it may unwind."
code = ["core/control/src/pid_controller.cpp"]

[[requirement]]
id = "SRS-CTL-004"
statement = "A NaN input shall command zero torque and shall not corrupt the controller's state."
code = ["core/control/src/pid_controller.cpp", "core/control/src/joint_controller.cpp"]

[[requirement]]
id = "SRS-CTL-005"
statement = "Controllers shall reject invalid parameters, and reset shall clear all history."
code = ["core/control/src/pid_controller.cpp", "core/control/src/joint_controller.cpp"]

[[requirement]]
id = "SRS-CTL-006"
statement = "Control code shall depend only on the hardware interface, and run unchanged against any implementation of it."
code = ["core/hardware/include/stapes/hardware/robot_interface.hpp", "core/control/CMakeLists.txt"]

[[requirement]]
id = "SRS-CTL-007"
statement = "The controller shall offset the motor target by the predicted gearbox deflection and backlash, keeping the tip within 50 um where uncompensated control exceeds 200 um."
code = ["core/control/src/joint_controller.cpp"]

[[requirement]]
id = "SRS-CTL-008"
statement = "Under closed-loop control the reference arm shall hold a pose against gravity with a true tip error below 50 um."
code = ["core/control/src/joint_controller.cpp"]

[[requirement]]
id = "SRS-CTL-009"
statement = "After a 0.05 rad step on all joints, the true tip error shall settle within 0.2 mm in under 2 s, with overshoot below 20 % of the step."
code = ["core/control/src/joint_controller.cpp"]

[[requirement]]
id = "SRS-CTL-010"
statement = "The loop shall hold within 0.2 mm with a 5 % mass error and 10 % stiffness error in the controller's model, and stay stable under a steady 5 N external force."
code = ["core/control/src/joint_controller.cpp"]

[[requirement]]
id = "SRS-DET-006"
statement = "Closed-loop runs including all sensors and physics shall be bit-identical for a seed, and differ between seeds."
code = ["core/plant/src/simulated_arm.cpp", "tests/support/closed_loop_workload.hpp"]

[[requirement]]
id = "SRS-RT-002"
statement = "Dynamics and a complete closed-loop tick shall perform no heap allocation."
code = ["core/dynamics/src/rigid_body_dynamics.cpp", "core/plant/src/simulated_arm.cpp", "core/control/src/joint_controller.cpp"]

[[requirement]]
id = "SRS-CTL-011"
statement = "The control loop shall remain stable, with the tip within 0.2 mm of the line, with 5 ticks of delay on readings and on commands."
code = ["core/control/src/joint_controller.cpp"]

[[requirement]]
id = "SRS-DET-007"
statement = "Runs that include a fault and a safety stop, or an approach from rest, shall be bit-identical for a seed, and differ between seeds."
code = ["core/sim/src/keyhole_simulation.cpp", "core/faults/src/fault_injector.cpp"]

[[requirement]]
id = "SRS-RT-003"
statement = "A complete simulation tick, including the fault injector and safety monitor, shall perform no heap allocation, before or after a stop."
code = ["core/sim/src/keyhole_simulation.cpp", "core/faults/src/fault_injector.cpp", "core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SEN-006"
statement = "An optical tracker shall report the tool pose with independent Gaussian position and orientation noise of the configured spread, always returning a valid rotation, and shall reject invalid noise."
code = ["core/plant/src/optical_tracker.cpp"]

[[requirement]]
id = "SRS-ARM-007"
statement = "The arm shall start at rest with its gearboxes carrying gravity, so that holding the gravity torque moves no link by more than 2 urad."
code = ["core/plant/src/simulated_arm.cpp"]

[[requirement]]
id = "SRS-ARM-008"
statement = "The safety channel shall read link encoders and an optical tracker independently of the control channel, with both channels stamped with the tick of sampling."
code = ["core/hardware/include/stapes/hardware/safety_interface.hpp", "core/plant/src/simulated_arm.cpp"]

[[requirement]]
id = "SRS-ARM-009"
statement = "Engaging the brakes shall remove motor torque, ignore later commands, stop each moving motor within 5 ticks when its load is within the rated brake torque, and slip otherwise; releasing them shall restore command."
code = ["core/plant/src/simulated_arm.cpp"]

[[requirement]]
id = "SRS-KEY-001"
statement = "The keyhole constraint shall be measured as the distance from a fixed point to the infinite line through the tool tip along its axis."
code = ["core/task/src/keyhole.cpp"]

[[requirement]]
id = "SRS-KEY-002"
statement = "A tool pose shall be constructible from a tip and an axis, or a tip and a fulcrum, turning from a reference by the smallest rotation so that no roll about the tool axis is added."
code = ["core/task/src/keyhole.cpp"]

[[requirement]]
id = "SRS-KEY-003"
statement = "A straight tunnel shall provide poses along its line clamped to its ends, and the depth and radial distance of any point, and shall reject end points that do not define it."
code = ["core/task/src/keyhole.cpp"]

[[requirement]]
id = "SRS-KEY-004"
statement = "A feed profile shall be continuous and monotonic, reach exactly the tunnel's length, respect the speed and acceleration limits, and reject non-positive parameters."
code = ["core/task/src/keyhole.cpp"]

[[requirement]]
id = "SRS-KEY-005"
statement = "A plan shall be checked along its whole length before any motion, and a plan that cannot be reached shall be refused with the arm unmoved. A run shall start on the plan."
code = ["core/task/src/keyhole.cpp", "core/sim/src/keyhole_simulation.cpp"]

[[requirement]]
id = "SRS-KEY-006"
statement = "Drilling the reference tunnel with no fault, every joint moving, the true tip and tool axis shall stay within 0.2 mm of the plan and the final depth within 0.2 mm of the target, across seeds."
code = ["core/sim/src/keyhole_simulation.cpp"]

[[requirement]]
id = "SRS-KEY-007"
statement = "Under a thrust opposing the feed that builds to 2 N, the true tip shall stay within 0.2 mm of the line."
code = ["core/sim/src/keyhole_simulation.cpp"]

[[requirement]]
id = "SRS-KEY-008"
statement = "Under closed-loop control, with the tip moving around a circle at about 2 mm/s, the tool axis shall stay within 0.2 mm of a fixed fulcrum while tilting by more than 0.1 rad."
code = ["core/task/src/keyhole.cpp"]

[[requirement]]
id = "SRS-KEY-009"
statement = "A joint move shall start and end at its two configurations with zero velocity and acceleration, move every joint monotonically and in step, report each joint's peak speed, and reject non-finite ends or a duration that is not positive."
code = ["core/task/src/joint_move.cpp"]

[[requirement]]
id = "SRS-KEY-010"
statement = "A run with an approach shall start at rest at its rest pose, reach the line before the entry guard, and hold there for the settle time before the feed starts. An approach whose tip would come within the guard on the way shall be refused with the arm unmoved."
code = ["core/sim/src/keyhole_simulation.cpp"]

[[requirement]]
id = "SRS-KEY-011"
statement = "From the reference rest pose with no fault, the arm shall reach the line and drill the tunnel without a stop across seeds, every joint below the monitor's speed limit, the true tip within 0.2 mm of the line from the entry guard inward, and the final depth within 0.2 mm of the target."
code = ["core/sim/src/keyhole_simulation.cpp"]

[[requirement]]
id = "SRS-FLT-001"
statement = "Before its start tick, or with no fault, the fault injector shall pass every reading and command through unchanged."
code = ["core/faults/src/fault_injector.cpp"]

[[requirement]]
id = "SRS-FLT-002"
statement = "A frozen motor encoder fault shall repeat that joint's last value before the fault, leaving other joints and the timestamp fresh."
code = ["core/faults/src/fault_injector.cpp"]

[[requirement]]
id = "SRS-FLT-003"
statement = "A frozen link encoder fault shall do the same on the safety channel only."
code = ["core/faults/src/fault_injector.cpp"]

[[requirement]]
id = "SRS-FLT-004"
statement = "A frozen tracker fault shall repeat the last tracked pose with a fresh timestamp."
code = ["core/faults/src/fault_injector.cpp"]

[[requirement]]
id = "SRS-FLT-005"
statement = "A stuck actuator fault shall hold that joint's last delivered torque and ignore new commands for it, leaving other joints under command."
code = ["core/faults/src/fault_injector.cpp"]

[[requirement]]
id = "SRS-FLT-006"
statement = "A comms delay fault shall deliver control readings, with their original timestamps, and commands late by the configured ticks in simulated time, without affecting the safety channel."
code = ["core/faults/src/fault_injector.cpp"]

[[requirement]]
id = "SRS-FLT-007"
statement = "Brake commands shall reach the robot directly under every fault."
code = ["core/faults/include/stapes/faults/fault_injector.hpp"]

[[requirement]]
id = "SRS-FLT-008"
statement = "The fault injector shall reject a joint or a delay out of range."
code = ["core/faults/src/fault_injector.cpp"]

[[requirement]]
id = "SRS-SAF-001"
statement = "The monitor shall reject a configuration with a limit that is not positive and finite, a margin or entry guard that is negative or not finite, a corridor that does not define a line, or a debounce below 1."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-002"
statement = "The monitor shall start clear, and stay clear for as long as every check passes."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-003"
statement = "NaN or infinity in any reading or in the target shall stop at once."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-004"
statement = "A sample on either channel older than the allowed age, or stamped in the future, shall stop at once."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-005"
statement = "A link encoder reading outside any joint's limits less the margin shall stop at once."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-006"
statement = "A link speed, from consecutive link readings, above that joint's limit in either direction shall stop at once. The first check has no earlier reading and does not judge speed."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-007"
statement = "A tool force magnitude above the limit for the debounce count of consecutive checks shall stop. Torque shall not count, and a clean check shall restart the count."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-008"
statement = "After the debounce, the monitor shall stop if the tracked tip is farther than the radius from the planned line, the tool axis is farther than the radius from the entry, or the tip is past the target by more than the margin. Backing out along the axis shall be allowed. The two distance checks apply from the entry guard inward (SRS-SAF-024)."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-009"
statement = "After the debounce, the monitor shall stop if the tracked tip differs from the tip computed from the link encoders by more than the limit."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-010"
statement = "After the debounce, the monitor shall stop if any motor encoder differs from its link encoder by more than that joint's limit."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-011"
statement = "After the debounce, the monitor shall stop if any link is farther from its target than that joint's limit."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-012"
statement = "Each debounced check shall keep its own count, unaffected by the others."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-013"
statement = "A stop shall be latched with its first cause, regardless of later input."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-014"
statement = "A reset shall succeed only if the current input passes every check, and shall then forget all counts and the earlier reading. While not stopped, it shall change nothing."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-015"
statement = "When several checks fail together, the cause reported shall be the first in the documented order."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-016"
statement = "The monitor's checks shall not throw, and the safety module shall not depend on the controller or the plant."
code = ["core/safety/include/stapes/safety/safety_monitor.hpp", "core/safety/CMakeLists.txt"]

[[requirement]]
id = "SRS-SAF-017"
statement = "Every stop cause shall have a name for logs and reports."
code = ["core/safety/src/reference_config.cpp"]

[[requirement]]
id = "SRS-SAF-018"
statement = "With no fault, the monitor shall not stop the reference drilling run, across seeds."
code = ["core/safety/src/safety_monitor.cpp", "core/safety/src/reference_config.cpp"]

[[requirement]]
id = "SRS-SAF-019"
statement = "With a frozen sensor or stuck actuator on any joint, at different times and seeds, the true tip and tool axis shall stay within 0.5 mm of the plan, and at least three quarters of runs shall stop. A frozen tracker shall always stop."
code = ["core/safety/src/safety_monitor.cpp", "core/sim/src/keyhole_simulation.cpp"]

[[requirement]]
id = "SRS-SAF-020"
statement = "A communication delay beyond the allowed age shall stop in the tick it appears. A delay within it shall not stop, and the tip shall stay within 0.2 mm of the line."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-021"
statement = "A force beyond what the loop can hold shall stop the robot with the true tip within 0.5 mm of the line."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-022"
statement = "After a stop the motors shall carry no torque, each motor shall stop, and the true tip shall move less than 0.2 mm from where it stopped."
code = ["core/sim/src/keyhole_simulation.cpp"]

[[requirement]]
id = "SRS-SAF-023"
statement = "With the monitor's limits out of reach, the same faults shall take the tip beyond the limits above, which shows the faults are real and the monitor is what contains them."
code = ["core/sim/src/keyhole_simulation.cpp", "tests/integration/test_fault_campaign.cpp"]

[[requirement]]
id = "SRS-TRC-001"
statement = "The trace recorder shall keep one sample per call, in order, holding the true tool pose, joint state, plan, distances from the plan, stop cause, fault state, brake state and whether the arm is still approaching at that tick."
code = ["core/sim/src/trace.cpp"]

[[requirement]]
id = "SRS-TRC-002"
statement = "The trace recorder shall reserve all its storage when built, reject zero capacity, never allocate while recording, and when full shall keep what it has and count each further sample as dropped."
code = ["core/sim/src/trace.cpp", "core/sim/include/stapes/sim/trace.hpp"]

[[requirement]]
id = "SRS-TRC-003"
statement = "Recording a run shall not change it: a recorded run and an unrecorded run of the same scenario shall have the same state hash."
code = ["core/sim/src/trace.cpp"]

# The Python layer. `layer` tells the traceability tool that these are verified by the Python
# tests, which only the `python` preset runs.

[[requirement]]
id = "SRS-PY-001"
statement = "A run stepped through the Python bindings shall produce the same state hash as the same run in a C++ program, and a different seed a different hash."
code = ["bindings/src/stapes_core.cpp"]
layer = "python"

[[requirement]]
id = "SRS-PY-002"
statement = "The bindings shall expose scenarios, faults, stop causes, the simulation and the trace recorder with the values the core holds, and shall report invalid arguments as Python exceptions."
code = ["bindings/src/stapes_core.cpp"]
layer = "python"

[[requirement]]
id = "SRS-PY-003"
statement = "Every named scenario shall end as its description says: with a stop and the true tip within 0.5 mm where a stop is expected, without one and within 0.2 mm otherwise, and with the monitor disabled the same fault shall take the tip more than a hundred times further."
code = ["python/stapes/scenarios.py", "python/stapes/run.py"]
layer = "python"

[[requirement]]
id = "SRS-PY-004"
statement = "A trace exported for the viewer shall be valid JSON with only finite numbers, holding the tunnel, the limits, the fault and stop events, one value per control period for each series and one arm pose per frame, and shall be byte-identical for the same seed."
code = ["python/stapes/viewer_export.py"]
layer = "python"

[[requirement]]
id = "SRS-PY-005"
statement = "The plots, the viewer and the manual shall use the same colour values: ink #0B1F2A, teal #0F766E, pale teal #CCFBF1 and signal red #D92D20."
code = ["python/stapes/palette.py", "viewer/style.css", "manual/tokens.json"]
layer = "python"

[[requirement]]
id = "SRS-SAF-024"
statement = "The monitor shall apply the corridor's two distance checks only when the tracked tip is less than the entry guard before the entry, judged from the tracked tip alone. Further out the tip may be anywhere. The depth limit past the target shall apply everywhere."
code = ["core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-SAF-025"
statement = "Each fault of the campaign, injected while the arm approaches from rest, shall stop the robot before the tip reaches the entry guard."
code = ["core/safety/src/safety_monitor.cpp", "core/sim/src/keyhole_simulation.cpp"]

[[requirement]]
id = "SRS-JOG-001"
statement = "In free mode the tool tip shall follow the operator's velocity command, cut to 25 mm/s, changed by at most 0.025 m/s², and slowed wherever a joint would pass half its speed limit, while the tool keeps its direction. Jogging shall start from a rest pose."
code = ["core/sim/src/jog_simulation.cpp"]

[[requirement]]
id = "SRS-JOG-002"
statement = "On the operator's request the arm shall move in joint space onto the planned line at the standoff, and shall refuse to while the tip is moving or when the move would bring the tip inside the entry guard."
code = ["core/sim/src/jog_simulation.cpp", "core/sim/src/planning.cpp"]

[[requirement]]
id = "SRS-JOG-003"
statement = "On the line, the operator shall set only the feed along it, no faster than the planned feed speed, from the standoff to the target, with the tip within 0.2 mm of the line inside the guard. Leaving the line shall be allowed only at the standoff."
code = ["core/sim/src/jog_simulation.cpp"]

[[requirement]]
id = "SRS-JOG-004"
statement = "The monitor shall stop the robot when the operator moves the tip into the entry guard off the line, before the tip reaches the entry."
code = ["core/sim/src/jog_simulation.cpp", "core/safety/src/safety_monitor.cpp"]

[[requirement]]
id = "SRS-JOG-005"
statement = "A fault started by the operator shall be contained as a planned one is: the robot stops with the true tip within 0.5 mm of the line. With no fault in the scenario, the request shall do nothing."
code = ["core/sim/src/jog_simulation.cpp", "core/faults/src/fault_injector.cpp"]

[[requirement]]
id = "SRS-JOG-006"
statement = "A jog session shall be a function of the seed and the sequence of operator inputs: the same sequence shall give the same state hash. A non-finite command shall be treated as no motion."
code = ["core/sim/src/jog_simulation.cpp"]

[[requirement]]
id = "SRS-PY-006"
statement = "A hands-on session shall be recorded as its sequence of operator inputs, and replaying a recording shall give the same state hash. One request to the local server shall advance at most 50 control periods."
code = ["python/stapes/jog.py"]
layer = "python"

[[requirement]]
id = "SRS-JOG-007"
statement = "In joint mode, only the chosen joint shall turn, at up to half its monitor speed limit and changing speed by at most 0.05 rad/s², and a joint no longer chosen shall slow down at that rate. Each joint shall slow down in time to stop 0.02 rad inside the monitor's margin, with no stop. Switching between free and joint mode shall wait for the arm to stop. An unknown joint or a non-finite rate shall move nothing."
code = ["core/sim/src/jog_simulation.cpp"]

[[requirement]]
id = "SRS-PY-007"
statement = "On Linux, the hands-on server shall read the first gamepad from its evdev device and give the page its state in the browser's standard layout, for both the generic HID and the xpad axis layouts, keeping a press shorter than a frame until it has been read once."
code = ["python/stapes/gamepad.py"]
layer = "python"
