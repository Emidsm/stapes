name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: "23.1.3"
  CLANG_TIDY_VERSION: "23.1.4"
  GCOVR_VERSION: "8.6"

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check formatting
        run: |
          find core tests benchmarks bindings \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 uvx "clang-format==${CLANG_FORMAT_VERSION}" --dry-run --Werror

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc, cxx: g++-14 }
          - { name: clang, cxx: clang++-18 }
        preset: [debug, release, sanitize]
    name: test (${{ matrix.compiler.name }}, ${{ matrix.preset }})
    env:
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 clang-18
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Check traceability
        if: matrix.preset == 'debug'
        run: |
          python3 tools/traceability.py \
            --requirements docs/requirements/requirements.toml \
            --results build/debug/test-results \
            --skip-layer python

  # The one job that runs every layer, C++ and Python, so it is the one that produces the
  # complete traceability matrix and the test report.
  evidence:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14
      - name: Create the Python environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r python/requirements.txt
      - name: Configure, build and test, with the Python bindings
        run: |
          source .venv/bin/activate
          cmake --workflow --preset python
      - name: Build the traceability matrix
        run: |
          python3 tools/traceability.py \
            --requirements docs/requirements/requirements.toml \
            --results build/python/test-results \
            --output build/python/traceability.md
      - name: Build the test report
        run: |
          python3 tools/test_report.py \
            --requirements docs/requirements/requirements.toml \
            --results build/python/test-results \
            --build-dir build/python \
            --output build/python/test-report.md
          cat build/python/test-report.md >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            build/python/traceability.md
            build/python/test-report.md

  determinism:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 clang-18
      - name: Build the probe with both compilers
        run: |
          CXX=g++-14 cmake --preset release -B build/gcc
          CXX=clang++-18 cmake --preset release -B build/clang
          cmake --build build/gcc --target determinism_probe
          cmake --build build/clang --target determinism_probe
      - name: Compare results
        run: |
          gcc_hash="$(build/gcc/tests/determinism_probe)"
          clang_hash="$(build/clang/tests/determinism_probe)"
          echo "GCC:   ${gcc_hash}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "Clang: ${clang_hash}" | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${gcc_hash}" = "${clang_hash}"

  clang-tidy:
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      - name: Configure and build
        run: |
          cmake --preset debug
          cmake --build --preset debug
      - name: Run clang-tidy
        run: |
          find core tests benchmarks -name '*.cpp' -print0 \
            | xargs -0 -n 1 -P 4 uvx "clang-tidy==${CLANG_TIDY_VERSION}" -p build/debug --quiet

  coverage:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14
      - name: Build and test with coverage
        run: cmake --workflow --preset coverage
      - name: Report coverage
        run: |
          uvx "gcovr==${GCOVR_VERSION}" --gcov-executable gcov-14 --root . --filter 'core/' \
            --object-directory build/coverage build/coverage \
            --exclude-throw-branches --exclude-unreachable-branches \
            --print-summary --html-details build/coverage/coverage.html \
            | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/coverage*.*

  mutation:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14
      - name: Fetch dependencies
        run: cmake --preset debug
      - name: Inject bugs and check that the tests catch them
        run: python3 tools/mutation_check.py --deps build/debug/_deps | tee -a "${GITHUB_STEP_SUMMARY}"
        shell: bash -o pipefail -e {0}

  benchmark:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14
      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release --target bench_kinematics bench_simulation
      - name: Run benchmarks
        run: |
          build/release/benchmarks/bench_kinematics \
            --benchmark_out=build/release/bench_kinematics.json --benchmark_out_format=json
          build/release/benchmarks/bench_simulation \
            --benchmark_out=build/release/bench_simulation.json --benchmark_out_format=json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: build/release/bench_*.json
